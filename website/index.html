<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first AWS website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello from AWS S3 👋</h1>
    <p>This page is hosted in an Amazon S3 bucket that was created entirely with <strong>Terraform</strong>.</p>
    <ul>
      <li>Infrastructure as code: every AWS resource is defined in <code>.tf</code> files.</li>
      <li>Edit this file, run <code>terraform apply</code>, and the change goes live.</li>
      <li>Run <code>terraform destroy</code> and it is all cleaned up.</li>
    </ul>
  </main>
</body>
</html>
